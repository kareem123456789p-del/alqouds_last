<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Directory | Al-Quds Center</title>
    <!-- Auth Guard -->
    <script src="js/authGuard.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/doctors.css">
    <style>
        /* Standalone Page Header Header Styling */
        .doctor-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .doctor-header .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .doctor-header .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .doctor-header .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
            flex-grow: 1;
            text-align: center;
        }

        .doctor-header .header-right {
            min-width: 120px;
            /* Balance the back button */
        }
    </style>
</head>

<body style="background: #f8fafc; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <!-- Navigation Header -->
    <header class="doctor-header">
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
        <h1 class="header-title"><i class="fa-solid fa-user-doctor" style="color: #3b82f6; margin-right: 8px;"></i>
            Al-Quds Center - Doctor Directory</h1>
        <div class="header-right"></div>
    </header>

    <!-- Main Content App -->
    <main style="padding: 30px; max-width: 1400px; margin: 0 auto;">
        <div id="app">
            <!-- Content Injected Here via doctors.js -->
            <p style="text-align: center; margin-top: 2rem; color: #64748b;">Loading...</p>
        </div>
    </main>

    <!-- Slide-out Panel -->
    <div class="slide-panel-overlay" onclick="closeDoctorProfile()"></div>
    <div class="slide-panel" id="doctor-profile-panel">
        <!-- Content injected via JS -->
    </div>

    <!-- Add Doctor Modal -->
    <div class="modal-overlay" id="addDoctorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-user-plus"></i> Add New Doctor</h2>
                <button class="close-modal" onclick="closeAddDoctorModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="addDoctorForm" onsubmit="submitAddDoctor(event)" dir="rtl">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" name="name" required placeholder="د. الاسم">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>التخصص</label>
                        <select name="specialty" required>
                            <option value="">اختر التخصص...</option>
                            <option value="جراحة عامة">جراحة عامة</option>
                            <option value="طب أطفال">طب أطفال</option>
                            <option value="طب أسنان">طب أسنان</option>
                            <option value="قلب وأوعية">قلب وأوعية</option>
                            <option value="عظام">عظام</option>
                            <option value="أشعة">أشعة</option>
                            <option value="باطنة">باطنة</option>
                            <option value="جراحة">جراحة</option>
                            <option value="أطفال">أطفال</option>
                            <option value="أسنان">أسنان</option>
                            <option value="قلب">قلب</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" name="phone" placeholder="+970 5XX-XXX-XXX">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>الموقع/الجناح</label>
                        <select name="location">
                            <option value="السيل "> السيل</option>
                            <option value="النفق "> النفق</option>
                            <option value="المحطه "> المحطه</option>
                            <option value="طريق السادات ">طريق السادات </option>
                            <option value="الحكروب ">الحكروب </option>
                            <option value="الاشاره ">الاشاره </option>
                            <option value="الكورنيش ">الكورنيش </option>
                            <option value="اسوان الجديده ">اسوان الجديده </option>
                            <option value="اخر ">اخر </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الحد الائتماني</label>
                        <input type="number" name="credit_limit" value="60000" min="0" step="500" dir="ltr" style="text-align: right;">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>الحالة</label>
                        <select name="status">
                            <option value="active">نشط</option>
                            <option value="away">إجازة/غير متاح</option>
                        </select>
                    </div>
                    <div class="form-group"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeAddDoctorModal()">إلغاء</button>
                    <button type="submit" class="btn-primary">حفظ الطبيب</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script imports -->
    <script src="js/doctors.js?v=2"></script>
</body>

</html>
