<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 مركز القدس | </title>
    <!-- Auth Guard -->
    <script src="js/authGuard.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/doctors.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="page-info">
                <div class="title-container">
                    <div class="breadcrumbs"></div>
                    <div class="page-title">
                        <h1>DASHBOURD</h1>
                    </div>
                </div>
                <img src="Gemini_Generated_Image_rszlsyrszlsyrszl.png" class="header-logo" alt="Logo">
            </div>

            <div class="top-actions">
                <!-- Admin Dashboard Link (visible only to ADMINs) -->
                <a id="admin-dashboard-link" href="/dashboard" style="display:none; text-decoration:none; color:#2563eb; font-weight:600; font-size:0.875rem; padding:0.5rem 1rem; border:1px solid #dbeafe; border-radius:6px; background:#eff6ff; align-items:center; gap:0.4rem;">
                    <i class="fa-solid fa-gauge-high"></i> لوحة التحكم
                </a>
                <!-- Notification Bell -->
                <button class="icon-btn">
                    <i class="fa-regular fa-bell"></i>
                </button>
                <!-- Logout -->
                <button class="icon-btn" onclick="(async()=>{await fetch('/api/auth/logout',{method:'POST'});window.location.href='/login.html';})()" title="تسجيل الخروج">
                    <i class="fa-solid fa-right-from-bracket" style="color:#ef4444;"></i>
                </button>
            </div>
        </header>

        <!-- Dashboard Scroll Area -->
        <div class="dashboard-scroll" id="app">
            <!-- Content Injected Here -->
        </div>
    </main>


    <!-- Show admin dashboard link only for ADMIN role -->
    <script>
        (function showAdminLinkIfAdmin() {
            // Wait for authGuard.js to populate window.__alqudsUser
            const check = setInterval(() => {
                if (window.__alqudsUser) {
                    clearInterval(check);
                    const role = window.__alqudsUser.role;
                    const isAdmin = (role === 'ADMIN' || role === 'Admin' || role === 'Super Admin');
                    if (isAdmin) {
                        const link = document.getElementById('admin-dashboard-link');
                        if (link) link.style.display = 'flex';
                    }
                }
            }, 100);
            // Stop checking after 5 seconds
            setTimeout(() => clearInterval(check), 5000);
        })();
    </script>

    <script src="js/main.js?v=1003"></script>
</body>

</html>
